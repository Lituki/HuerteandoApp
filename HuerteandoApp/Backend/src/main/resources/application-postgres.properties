# ==========================================
# PERFIL POSTGRES (SUPABASE)
# ==========================================
# Este archivo se usa cuando activas:
# SPRING_PROFILES_ACTIVE=postgres

# ------------------------------------------
# CONEXIÓN A BASE DE DATOS (Render)
# ------------------------------------------
# Estas variables vienen de Render (Environment)

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Driver PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# ------------------------------------------
# CONFIGURACIÓN DE HIBERNATE / JPA
# ------------------------------------------

# Validar que las tablas ya existen (NO crea ni modifica)
spring.jpa.hibernate.ddl-auto=validate

# Evita ejecutar scripts SQL automáticos
spring.sql.init.mode=never

# Esquema por defecto (opcional si ya usas currentSchema en la URL)
spring.jpa.properties.hibernate.default_schema=huerteando

# Evita error de prepared statements con poolers (Supabase).
spring.datasource.hikari.data-source-properties.prepareThreshold=0

# Límite para subida de ficheros (avatar/imagenes).
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ------------------------------------------
# LOGS (opcional, útil para depurar)
# ------------------------------------------

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
